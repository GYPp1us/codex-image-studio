name: 测试
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: 后端集成与前端语法
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: 安装锁定依赖
        run: python -m pip install -r requirements.lock.txt
      - name: 后端集成测试（不调用真实模型）
        run: python -m unittest discover -s tests -v
      - name: 前端语法
        run: for file in static/*.js; do node --check "$file"; done
      - name: 缩略图稳定性回归
        run: npm ci --ignore-scripts && npm test
      - name: Python 编译
        run: python -m py_compile *.py deploy/*.py scripts/*.py tests/*.py
